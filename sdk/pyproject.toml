[project]
name = "langtest"
version = "0.1.0"
description = "Wrap a compiled LangGraph graph for time-travel debugging with LangTest"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "langtest-server",
]

[tool.uv.sources]
langtest-server = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langtest"]

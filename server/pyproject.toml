[project]
name = "langtest-server"
version = "0.1.0"
description = "FastAPI backend for LangTest — reads a LangGraph checkpointer's storage"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langtest_server"]
